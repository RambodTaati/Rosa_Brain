[project]
name = "rosa-brain"
version = "0.1.0"
description = "Rosa_Brain — from-scratch cognitive agent (no pretrained LLMs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "psutil>=5.9.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "numpy>=1.26.0",
  "lxml>=5.0.0",
]

[project.scripts]
rosa-brain = "rosa_brain.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rosa_brain*"]
